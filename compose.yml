services:

  server-desarrollo:
    profiles: ["desarrollo"]

    build:
      context: .
      dockerfile: Dockerfile

    environment:
      NODE_ENV: dev
      PORT: ${PORT}
      MONGO_URI: ${MONGO_URI}

    container_name: trabajotassbackend

    ports:
      - "3000:3000"

    depends_on:
      - mongodb

  mongodb:
    image: mongo:8

    container_name: trabajotassmongo

    ports:
      - "27017:27017"

    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data: